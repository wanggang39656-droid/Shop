<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG="zh";try{LANG=localStorage.getItem("lang1")==="en"?"en":"zh"}catch(e){}
const L=(z,e)=>LANG==="zh"?z:e;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast(L("存储空间不足,保存失败","Storage full, save failed"));return false}};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmtD(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmtD(d)};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}

/* ---------- IndexedDB Image Store & Blob URL Manager ---------- */
const ImgDB = {
  db: null,
  ok: true,
  init() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) { this.ok = false; toast(L("当前浏览器不支持 IndexedDB，图片存储不可用", "IndexedDB unsupported, image storage disabled")); return res(false); }
        const req = indexedDB.open("ShopManagerImgDB", 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
        };
        req.onsuccess = e => { this.db = e.target.result; this.ok = true; res(true); };
        req.onerror = () => { this.ok = false; toast(L("无痕/隐私模式下 IndexedDB 不可用，图片保存将失效", "IndexedDB unavailable in private mode, image saving disabled")); res(false); };
      } catch (err) {
        this.ok = false;
        toast(L("IndexedDB 初始化异常，图片保存将失效", "IndexedDB error, image saving disabled"));
        res(false);
      }
    });
  },
  put(id, blob) {
    return new Promise(res => {
      if (!this.ok || !this.db) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");
        tx.objectStore("images").put(blob, id);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(id) {
    return new Promise(res => {
      if (!this.ok || !this.db || !id) return res(null);
      try {
        const tx = this.db.transaction("images", "readonly");
        const req = tx.objectStore("images").get(id);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  del(id) {
    return new Promise(res => {
      if (!this.ok || !this.db || !id) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");
        tx.objectStore("images").delete(id);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  all() {
    return new Promise(res => {
      if (!this.ok || !this.db) return res({});
      try {
        const tx = this.db.transaction("images", "readonly");
        const st = tx.objectStore("images");
        const kr = st.getAllKeys(), vr = st.getAll();
        tx.oncomplete = () => {
          const out = {};
          (kr.result || []).forEach((k, idx) => { out[k] = vr.result[idx]; });
          res(out);
        };
        tx.onerror = () => res({});
      } catch (e) { res({}); }
    });
  },
  clear() {
    return new Promise(res => {
      if (!this.ok || !this.db) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");

        tx.oncomplete = () => res(true);

const BlobPool = {
  urls: new Set(),
  create(blob) {
    if (!blob) return "";
    const u = URL.createObjectURL(blob);
    this.urls.add(u);
    return u;
  },
  revoke(u) {
    if (u && this.urls.has(u)) {
      URL.revokeObjectURL(u);
      this.urls.delete(u);
    }
  },
  clear() {
    this.urls.forEach(u => URL.revokeObjectURL(u));
    this.urls.clear();
  }
};

function revokeAllObjUrl() {
  BlobPool.clear();
}

function revokeContainerBlobs(root) {
  if (!root) return;
  root.querySelectorAll("img").forEach(img => {
    if (img.src && img.src.startsWith("blob:")) {
      BlobPool.revoke(img.src);
      img.removeAttribute("src");
    }
  });
}

async function hydrateImages(root = document) {
  const els = root.querySelectorAll("img[data-imgid]");
  for (const el of els) {
    const id = el.getAttribute("data-imgid");
    if (!id) continue;
    if (el.dataset.loadedId === id && el.src && el.src.startsWith("blob:")) continue;
    if (el.src && el.src.startsWith("blob:")) BlobPool.revoke(el.src);
    const blob = await ImgDB.get(id);
    if (blob) {
      el.src = BlobPool.create(blob);
      el.dataset.loadedId = id;
    }
  }
}

async function releaseUnusedImg(imgId) {
  if (!imgId) return;
  const inUse = items.some(it => it.img === imgId);
  if (!inUse) await ImgDB.del(imgId);
}

async function compressToBlob(source) {
  const url = source instanceof Blob ? URL.createObjectURL(source) : source;
  const im = await new Promise(r => {
    const m = new Image();
    m.onload = () => r(m);
    m.onerror = () => r(null);
    m.src = url;
  });
  if (source instanceof Blob) URL.revokeObjectURL(url);
  if (!im) return null;
  const k = Math.min(1, 600 / Math.max(im.width, im.height));
  const c = document.createElement("canvas");
  c.width = Math.round(im.width * k);
  c.height = Math.round(im.height * k);
  const x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.85));
}

async function safeInitStorage() {

function migrateOldGoods() {
  let changed = false;
  items.forEach(it => {
    const hasLegacy = ("sup" in it) || ("code" in it) || ("cost" in it);
    if (!Array.isArray(it.supplierItems)) {
      it.supplierItems = [];
      const supId = it.sup ? String(it.sup) : "";
      const code = String(it.code || "").trim();
      const cost = +it.cost || 0;
      if (supId || code || cost > 0) {
        it.supplierItems.push({
          supId,
          supName: supId ? nm(sups, supId) : "",
          barcode: code,
          cost,
          note: ""
        });
      }
      changed = true;
    } else {
      it.supplierItems.forEach(si => {
        if (si.sup !== undefined && si.supId === undefined) { si.supId = String(si.sup || ""); delete si.sup; changed = true; }
        if (si.code !== undefined && si.barcode === undefined) { si.barcode = String(si.code || ""); delete si.code; changed = true; }
        if (si.supId && !si.supName) { si.supName = nm(sups, si.supId); changed = true; }
        if (si.note === undefined) { si.note = ""; changed = true; }
        si.cost = +si.cost || 0;
      });
    }
    if (hasLegacy) {
      delete it.sup;
      delete it.code;
      delete it.cost;
      changed = true;
    }
  });
  if (changed) SAVE.items();
}

function sanitizeFilename(s) {
  return String(s || "").replace(/[\\/:*?"<>|]/g, "_").replace(/[\x00-\x1f]/g, "").replace(/\s+/g, " ").trim().replace(/\.+$/, "");

async function exportAllImagesZip() {
  if (!ImgDB.ok) {
    toast(L("IndexedDB 不可用，无法导出图片", "IndexedDB unavailable"));
    return;
  }
  if (typeof JSZip === "undefined") {
    toast(L("JSZip 组件未加载，请检查网络", "JSZip not loaded"));
    return;
  }
  const all = await ImgDB.all();
  const keys = Object.keys(all);
  if (!keys.length) {
    toast(L("暂无已保存的图片", "No images to export"));
    return;
  }
  toast(L("正在打包图片 ZIP…", "Zipping images…"));
  const zip = new JSZip();
  const folder = zip.folder("shop_images");
  const usedNames = new Set();
  const imgToProducts = new Map();

  items.forEach(it => {
    const imgId = imgOf(it);
    if (!imgId) return;
    if (!imgToProducts.has(imgId)) imgToProducts.set(imgId, []);
    imgToProducts.get(imgId).push(it);
  });

  const getExt = blob => {
    const t = (blob && blob.type || "").toLowerCase();
    if (t.includes("png")) return "png";
    if (t.includes("webp")) return "webp";
    return "jpg";
  };

  const uniqueFilename = (base, ext) => {
    const clean = sanitizeFilename(base) || "image";
    let candidate = `${clean}.${ext}`;
    let idx = 2;
    while (usedNames.has(candidate.toLowerCase())) {
      candidate = `${clean}_${idx}.${ext}`;
      idx++;
    }
    usedNames.add(candidate.toLowerCase());
    return candidate;
  };

  let totalFiles = 0;
  keys.forEach(imgId => {
    const blob = all[imgId];
    if (!blob) return;
    const ext = getExt(blob);
    const linked = imgToProducts.get(imgId);
    if (linked && linked.length > 0) {
      linked.forEach(it => {
        const gName = sanitizeFilename(pname(it)) || sanitizeFilename(it.brand) || imgId;
        const gCode = sanitizeFilename(itemPrimaryCode(it));
        const baseName = gCode ? `${gName}_${gCode}` : gName;
        const fname = uniqueFilename(baseName, ext);
        folder.file(fname, blob);
        totalFiles++;
      });
    } else {
      const fname = uniqueFilename(imgId, ext);
      folder.file(fname, blob);
      totalFiles++;
    }
  });

  try {
    const content = await zip.generateAsync({ type: "blob" });
    await saveFile(`shop-images-${today()}.zip`, content, "application/zip");
    toast(L(`已导出 ${totalFiles} 个图片文件`, `Exported ${totalFiles} image files`));
  } catch (e) {
    toast(L("导出 ZIP 失败", "ZIP export failed"));
  }
}

function buildModal(){$("scan_modal").innerHTML=`<div class="card" style="width:min(420px,100%);margin:0"><h3>${L("扫描条码","Scan barcode")}</h3><div style="position:relative;background:#000"><video id="scan_video" playsinline muted autoplay style="width:100%;height:42vh;object-fit:cover;display:block"></video><div style="position:absolute;left:8%;right:8%;top:25%;bottom:25%;border:2px solid #ffe600;border-radius:6px;pointer-events:none"></div></div><div id="scan_tmp" style="display:none"></div><div id="scan_st" class="muted" style="margin:8px 0 2px"></div><div id="scan_n" class="muted"></div><div class="muted" style="margin:2px 0 8px">${L("手机离条码 10–20 厘米,条码平整、光线充足","Hold 10–20 cm away, barcode flat and well lit")}</div><div class="row" style="margin-bottom:8px"><input class="in" id="scan_manual" placeholder="${L("手动输入条码","Type barcode")}" style="flex:1;width:auto"><button class="btn" data-act="scan-ok">${L("使用","Use")}</button></div><div class="row"><label class="btn pri">${L("拍照识别","Take photo")}<input type="file" accept="image/*" capture="environment" id="scan_file" hidden></label><button class="btn" data-act="scan-close">${L("关闭","Close")}</button></div></div>`;
 $("scan_file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;scanSt("…");const c=await decodeFile(f);if(!c){scanSt(L("照片中没有识别到条码,请靠近并在更亮的环境下重试","No barcode found in the photo"));return}lastC="";onCode(c)};
 $("scan_manual").onkeydown=e=>{if(e.key==="Enter")ACT["scan-ok"]()}}
let stream=null,scanTimer=null,scanBusy=false,scanQ=null,scanN=0,scanTick=0,scanCb=null,scanCont=false,lastC="",lastT=0;
const scanSt=m=>{const e=$("scan_st");if(e)e.textContent=m};
const normCode=x=>String(x).trim();
function findByCode(c){
  const code = normCode(c);
  if (!code) return null;
  const alts = [code];
  if (/^\d{12}$/.test(code)) alts.push("0" + code);
  if (/^0\d{12}$/.test(code)) alts.push(code.slice(1));
  return items.find(x => Array.isArray(x.supplierItems) && x.supplierItems.some(si => alts.includes(String(si.barcode || "").trim()))) || null;
}
function onCode(raw){const c=normCode(raw),now=Date.now();if(c===lastC&&now-lastT<2000)return;lastC=c;lastT=now;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}scanCb(c);if(!scanCont)closeScan()}
function h5cfg(){const F=window.Html5QrcodeSupportedFormats,c={verbose:false};if(F)c.formatsToSupport=[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39];return c}
async function openScan(cb,cont){scanCb=cb;scanCont=!!cont;lastC="";scanN=0;$("scan_modal").style.display="flex";scanSt(L("正在启动摄像头…","Starting camera…"));$("scan_n").textContent="";
 const v=$("scan_video");
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("getUserMedia unsupported");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  const tr=stream.getVideoTracks()[0];tr.onended=()=>scanSt(L("摄像头被系统中断,请关闭后重试","Camera stopped by the system"));
  v.srcObject=stream;v.muted=true;v.setAttribute("playsinline","");await v.play();try{await tr.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(_){}
  scanSt(L("请将摄像头对准条码","Point the camera at a barcode")+" ("+v.videoWidth+"×"+v.videoHeight+")");scanLoop()}
 catch(e){stopStream();scanSt(L("当前环境无法使用摄像头,请改用拍照识别或手动输入","Camera unavailable, use photo or type")+" ("+((e&&(e.name||e.message))||e)+")")}}
async function frameCode(v){if(!v.videoWidth)return null;
 const W=v.videoWidth,H=v.videoHeight,band=(scanTick++%2===0);
 const sx=band?Math.round(W*.1):0,sy=band?Math.round(H*.3):0,sw=band?Math.round(W*.8):W,sh=band?Math.round(H*.4):H;
 const k=Math.min(1,1280/sw),c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext("2d").drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
 if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(c);if(r.length)return r[0].rawValue}catch(e){}}
 try{const r=eanFromCanvas(c);if(r)return r}catch(e){}
 if(typeof Html5Qrcode!=="undefined"){try{const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));if(!scanQ)scanQ=new Html5Qrcode("scan_tmp",h5cfg());return await Promise.race([scanQ.scanFile(new File([b],"f.jpg",{type:"image/jpeg"}),false),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),1500))])}catch(e){}}
 return null}
function scanLoop(){clearTimeout(scanTimer);if(!stream)return;
 scanTimer=setTimeout(async()=>{if(!stream)return;if(!scanBusy){scanBusy=true;$("scan_n").textContent=L("识别中…已尝试 "+(++scanN)+" 次","Scanning… "+scanN+" tries");try{const c=await frameCode($("scan_video"));if(c&&stream)onCode(c)}catch(e){}scanBusy=false}scanLoop()},350)}
function stopStream(){clearTimeout(scanTimer);if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}const v=$("scan_video");if(v)v.srcObject=null}
function closeScan(){$("scan_modal").style.display="none";stopStream()}
async function shrink(f){try{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>r(new File([x],"scan.jpg",{type:"image/jpeg"})),"image/jpeg",.9))}catch(e){return f}}
async function decodeFile(f){
 if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r.length)return r[0].rawValue}catch(e){}}
 try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);const r=eanFromCanvas(c);if(r)return r}catch(e){}
 if(typeof Html5Qrcode!=="undefined"){try{const q=new Html5Qrcode("scan_tmp",h5cfg());let r;try{r=await q.scanFile(await shrink(f),false)}catch(_){r=await q.scanFile(f,false)}try{q.clear()}catch(e){}return r}catch(e){}}
 return null}

 if(ex&&bc){var mt=Math.max(0,bc.offsetTop-tx.offsetTop-dt.offsetTop-3);ex.style.marginTop=mt+"px";ex.style.height=Math.max(0,dt.clientHeight-mt)+"px"}

const pcell=(i,t,sub)=>`<div class="pc">${imgOf(i)?`<img class="thumb" src="" data-imgid="${esc(imgOf(i))}" data-act="imgzoom" data-id="${i.id}" alt="">`:`<span class="noimg">📦</span>`}<div class="pt"><a class="lnk" data-go="prod-detail-${i.id}">${hl(pname(i),t||[])}</a>${sub?`<div class="sub">${sub}</div>`:""}</div></div>`;
const poNo=d=>"PO"+d.replace(/-/g,"")+String(pos.filter(p=>p.date===d).length+1).padStart(3,"0");
const unitTxt=l=>l.unit==="box"?L("箱","box"):L("个","pcs");
const lnTxt=l=>l.qty+unitTxt(l)+(l.unit==="box"?` (${l.perBox||1}${L("个/箱","/box")} = ${lnPcs(l)}${L("个","pcs")})`:"");
const sugP=i=>i.min>0&&i.qty<=i.min?Math.max(2*i.min-i.qty,1):0;
const sugTxt=i=>{const p=sugP(i);return p?p+L("个","pcs")+(i.box>1?` (${Math.ceil(p/i.box)}${L("箱","box")})`:""):"—"};
const poLineBarcode=(l,p)=>{
 if(l&&l.barcode)return String(l.barcode);
 const it=byId(items,l.pid);if(!it)return"";
 if(p&&p.sup)return itemEntryForSup(it,p.sup).barcode||itemPrimaryCode(it);
 return itemPrimaryCode(it);
};
const poLineCodesSummary=p=>{
 const codes=p.lines.map(l=>poLineBarcode(l,p)).filter(Boolean);
 if(!codes.length)return`<span class="muted">—</span>`;
 const preview=codes.slice(0,2).join(", ")+(codes.length>2?` +${codes.length-2}`:"");
 return`<span class="bcn" title="${esc(codes.join(", "))}">${esc(preview)}</span>`;
};

function exportPoExcel(p){
 const supName=nm(sups,p.sup);
 const rows=p.lines.map((l,k)=>{
  const it=byId(items,l.pid);
  const bc=poLineBarcode(l,p);
  return[k+1,p.no||"DRAFT",supName,p.date,it?pname(it):"?",it?it.sku:"",bc,l.qty,l.unit==="box"?"box":"pcs",lnPcs(l),l.cost,+(lnPcs(l)*l.cost).toFixed(2)];
 });
 outXlsx(rows,`${p.no||"purchase-order"}.xlsx`,["#","PO No","Supplier","Date","Product","SKU","Barcode","Qty","Unit","Total Pieces","Cost/pc","Amount"]);
}

/* create / edit */
let poD=null;
const newPo=()=>({id:uid(),no:"",sup:"",date:today(),note:"",status:"draft",lines:[],isNew:true});
const poSave=()=>{if(poD&&poD.isNew)sv("podraft1",poD)};
function addLine(it,q,unit){
 if(unit==="box"&&!(it.box>1))unit="pc";
 const pcs=unit==="box"?q*it.box:q;
 const supEntry=poD.sup?itemEntryForSup(it,poD.sup):itemPrimaryEntry(it);
 const lineCost=(supEntry&&supEntry.cost>0)?supEntry.cost:itemCost(it);
 const lineBarcode=(supEntry&&supEntry.barcode)?supEntry.barcode:itemPrimaryCode(it);
 const l=poD.lines.find(x=>String(x.pid)===String(it.id));
 if(l){const tot=lnPcs(l)+pcs;if(it.box>1&&tot%it.box===0){l.unit="box";l.qty=tot/it.box}else{l.unit="pc";l.qty=tot}l.perBox=it.box||1;if(!l.barcode)l.barcode=lineBarcode}
 else poD.lines.push({pid:it.id,barcode:lineBarcode,qty:q,unit,perBox:it.box||1,cost:lineCost});
 poSave()
}

 const same=poD&&poD.__s&&((id&&String(poD.id)===String(id))||(!id&&poD.isNew));
 if(!same){if(o)poD=JSON.parse(JSON.stringify(o));else{poD=ld("podraft1",null)||newPo();poD.isNew=true;if(S.__newpo){if(String(poD.sup)!==String(S.__newpo)){poD=newPo();poD.sup=S.__newpo}}}delete S.__newpo;poD.__s=1;S.poTab="pick"}
 poD.lines.forEach(l=>{if(!l.unit)l.unit="pc";if(!l.perBox)l.perBox=1;if(!l.barcode)l.barcode=poLineBarcode(l,poD)});
 main(head(o?L("编辑采购单","Edit order")+" "+esc(o.no):L("新建采购单","New purchase order"),`${bk}${o?"po-detail-"+o.id:"po-list"}">← ${L("返回","Back")}</button>${poD.isNew&&poD.lines.length?`<button class="btn red" data-act="po-discard">${L("放弃草稿","Discard")}</button>`:""}`)+`<div class="card"><div class="fg">${F("sup","供应商","Supplier",poD.sup,{type:"select",opts:supOpts(),req:1})}${F("date","日期","Date",poD.date,{type:"date"})}${F("note","备注","Note",poD.note,{w:"full"})}</div></div><div id="po_body"></div>`);paintPo()};

async function savePdf(pages,name){const enc=new TextEncoder(),parts=[],offs=[0];let n=0;

 const obj=i=>{offs[i]=n;str(i+" 0 obj\n")},end=()=>str("\nendobj\n");

 obj(1);str("<< /Type /Catalog /Pages 2 0 R >>");end();

  const s=`q 595 0 0 842 0 0 cm /Im${i} Do Q\n`;obj(ct);str(`<< /Length ${s.length} >>\nstream\n${s}endstream`);end();
  obj(xo);str(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.u.length} >>\nstream\n`);add(im.u);str("\nendstream");end()});

document.addEventListener("change",async e=>{if(e.target.id!=="bak_in")return;const f=e.target.files[0];if(!f)return;
 try{
  let d=null;
  let restoredImgCount=0;
  if(/\.zip$/i.test(f.name)){
   if(typeof JSZip==="undefined")throw new Error("JSZip missing");
   toast(L("正在解析备份包…","Extracting backup…"));
   const zip=await JSZip.loadAsync(f);
   const jsonFile=zip.file("backup.json");
   if(!jsonFile)throw new Error("Invalid backup zip: missing backup.json");
   d=JSON.parse(await jsonFile.async("string"));
   if(!d||!Array.isArray(d.items))throw new Error("Invalid data structure");
   if(ImgDB.ok){
    await ImgDB.clear();
    const imgFiles=[];
    zip.folder("images").forEach((relPath,file)=>{
     if(!file.dir)imgFiles.push({relPath,file});
    });
    for(const item of imgFiles){
     const blob=await item.file.async("blob");
     const imgId=item.relPath.replace(/\.[^.]+$/,"");
     const typedBlob=new Blob([blob],{type:item.relPath.endsWith(".png")?"image/png":"image/jpeg"});
     if(await ImgDB.put(imgId,typedBlob))restoredImgCount++;
    }
   }
  }else{

  else if(m==="recover")b=inp("lg_a","账号","Account","text","username")+inp("lg_c","恢复码","Recovery code")+inp("lg_p","新密码(至少6位)","New password (min 6)","password","new-password")+inp("lg_p2","确认新密码","Confirm new password","password","new-password")+btn("lg-ok","重置密码","Reset","pri")+btn("lg-back","返回","Back");
  else if(m==="chpw")b=inp("lg_o","当前密码","Current password","password","current-password")+inp("lg_p","新密码(至少6位)","New password (min 6)","password","new-password")+inp("lg_p2","确认新密码","Confirm new password","password","new-password")+btn("lg-ok","保存","Save","pri")+btn("lg-back","取消","Cancel");
  else b=`<p class="muted">${L("忘记管理员密码时,可用此恢复码重置。请截图或抄写后妥善保管,此码只显示这一次。","Use this code to reset the admin password if you forget it. Save it now — it is shown only once.")}</p><div class="rc">${code}</div>`+btn("lg-ok","我已保存,继续","I saved it, continue","pri");
  $("login").innerHTML=`<div class="card"><h3 style="font-size:17px;margin-bottom:2px">${esc(CFG.shop||L("杂货店管理系统","Shop Manager"))}</h3><div class="muted" style="margin-bottom:12px">${L(...T)}</div>${b}<div id="lg_e" class="tag r" style="display:block;margin-top:10px;white-space:normal;background:none;padding:0"></div><div style="margin-top:12px"><a class="lnk muted" data-act="lang">${LANG==="zh"?"English":"中文"}</a></div></div>`;
  setTimeout(()=>{const f=$("login").querySelector("input");if(f)f.focus()},50)}

 function gate(){const u=me(),lg=$("login");
  const m=code?"code":!staff.some(x=>x.ph)?"setup":!u?(mode==="recover"?"recover":"login"):mode==="chpw"?"chpw":"";
  if(!u){$("main").innerHTML="";$("side").innerHTML="";$("crumb").innerHTML="";$("bnav").innerHTML="";$("usr").textContent="";$("pwbtn").style.display=$("outbtn").style.display="none"}
  else{$("usr").textContent=u.name;$("pwbtn").style.display=$("outbtn").style.display="";$("outbtn").textContent=L("退出","Logout")}
  if(!m){lg.style.display="none";lg.innerHTML="";return true}
  if(lg.style.display!=="flex"||cm!==m||!lg.innerHTML){paint(m);lg.style.display="flex"}
  return!!u}

 ACT["lg-ok"]=async()=>{try{
  if(cm==="code"){code="";mode="";render(true);return}
  if(cm==="login"){if(locked())return;const m=findAcc(g("lg_a"));
   if(!m||!m.ph||m.status==="off"||await hashPw(g("lg_p"),m.salt)!==m.ph){bad();err(L("账号或密码错误,或账号已停用","Wrong account or password, or account disabled"));return}
   fail=0;start(m,$("lg_r").checked);mode="";history.replaceState(null,"","#home");render(true);return}
  if(cm==="setup"){const n=g("lg_n").trim(),a=g("lg_a").trim();if(!n||!a){err(L("请填写姓名和账号","Name and account required"));return}
   const p=chkPw();if(!p)return;const ar=adminRole();let m=findAcc(a);
   if(m){m.role=ar.id;m.status="on";m.name=m.name||n}else{m={id:uid(),name:n,account:a,phone:"",email:"",role:ar.id,status:"on",joined:today(),note:""};staff.push(m)}
   await setPw(m,p);const c=newCode(),s=rnd();localStorage.setItem(RK,JSON.stringify({s,h:await hashPw(c.replace(/-/g,""),s)}));
   start(m,true);code=c;render(true);return}
  if(cm==="recover"){if(locked())return;let rec=null;try{rec=JSON.parse(localStorage.getItem(RK)||"null")}catch(e){}
   if(!rec){err(L("此设备没有恢复码,无法重置","No recovery code on this device"));return}
   const m=findAcc(g("lg_a")),c=g("lg_c").toUpperCase().replace(/[^A-Z0-9]/g,"");
   if(!m||await hashPw(c,rec.s)!==rec.h){bad();err(L("账号或恢复码不正确","Wrong account or recovery code"));return}
   const p=chkPw();if(!p)return;await setPw(m,p);fail=0;mode="";toast(L("密码已重置,请登录","Password reset, please sign in"));render(true);return}
  if(cm==="chpw"){const m=me();if(!m||await hashPw(g("lg_o"),m.salt)!==m.ph){err(L("当前密码不正确","Current password is wrong"));return}
   const p=chkPw();if(!p)return;await setPw(m,p);mode="";toast(L("密码已修改","Password changed"));render()}
 }catch(e){console.error(e);err(L("当前环境不支持加密功能,请通过 https 打开","Crypto unavailable; please open via https"))}};
 ACT["lg-rec"]=()=>{mode="recover";render()};
 ACT["lg-back"]=()=>{mode="";render()};
 ACT.pw=()=>{mode="chpw";render()};
 ACT.logout=()=>{clrS();mode="";code="";history.replaceState(null,"","#home");render(true)};
 $("login").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();ACT["lg-ok"]()}});
 return{gate,me,can,setPw,uid:()=>{const m=me();return m?m.id:null}}
})();
const canM=k=>k==="home"||AUTH.can(k);

/* ---------- boot ---------- */
(async function boot() {
  await safeInitStorage();
  migrateOldGoods();
  norm();
  buildModal();
  render();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
