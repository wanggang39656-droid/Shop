<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG="zh";try{LANG=localStorage.getItem("lang1")==="en"?"en":"zh"}catch(e){}
const L=(z,e)=>LANG==="zh"?z:e;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast(L("存储空间不足,保存失败","Storage full, save failed"));return false}};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmtD(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmtD(d)};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
/* ---------- barcode tables ---------- */
const T=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const R=T.map(s=>[...s].map(c=>c^1).join(""));const G=R.map(s=>[...s].reverse().join(""));
const P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
const eanOk=c=>{if(!/^\d{13}$/.test(c))return false;let x=0;for(let i=0;i<12;i++)x+=(+c[i])*(i%2?3:1);return(10-x%10)%10===+c[12]};
const C128P=["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111", "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];
const ean13Bits=c=>{const d=[...c].map(Number);let s="101";for(let i=1;i<7;i++)s+=(P[d[0]][i-1]==="L"?T:G)[d[i]];s+="01010";for(let i=7;i<13;i++)s+=R[d[i]];return s+"101"};
const ean8Ok=c=>{if(!/^\d{8}$/.test(c))return false;const d=[...c].map(Number);const s=3*(d[0]+d[2]+d[4]+d[6])+d[1]+d[3]+d[5];return(10-s%10)%10===d[7]};
const ean8Bits=c=>{const d=[...c].map(Number);let s="101";for(let i=0;i<4;i++)s+=T[d[i]];s+="01010";for(let i=4;i<8;i++)s+=R[d[i]];return s+"101"};
function c128Codes(t){const codes=[];if(/^\d{4,}$/.test(t)&&t.length%2===0){codes.push(105);for(let i=0;i<t.length;i+=2)codes.push(+t.slice(i,i+2))}else{codes.push(104);for(const ch of t)codes.push(ch.charCodeAt(0)-32)}let s=codes[0];for(let i=1;i<codes.length;i++)s+=codes[i]*i;codes.push(s%103,106);return codes}
function c128Bits(t){let b="";c128Codes(t).forEach(c=>{let bar=1;for(const w of C128P[c]){b+=(bar?"1":"0").repeat(+w);bar^=1}});return b}
/* any barcode text -> bars: EAN-13 / UPC-A / EAN-8 when the digits are a valid retail code, otherwise Code 128 (self-made codes) */

/* ===== PDF (drawn on canvas, embedded as JPEG pages — supports Chinese without font files) ===== */
const PK=200/150;
const loadImg=src=>new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});
const FONT='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Heiti SC",system-ui,sans-serif';
async function poPdf(p){
 const PK=200/150;
 const W=1240,H=1754,M=70,pages=[],RH=136;let c,x,y;

 const np=()=>{
  c=document.createElement("canvas");
  c.width=Math.round(W*PK);
  c.height=Math.round(H*PK);
  x=c.getContext("2d");
  x.scale(PK,PK);
  x.fillStyle="#fff";
  x.fillRect(0,0,W,H);
  x.fillStyle="#111";
  x.textBaseline="top";
  pages.push(c);
  y=M
 };

 const T=(t,px,xx,yy,o)=>{
  o=o||{};
  x.font=(o.b?"bold ":"")+px+"px "+FONT;
  x.fillStyle=o.col||"#111";
  x.textAlign=o.al||"left";
  x.fillText(String(t),xx,yy)
 };

 const wrap=(t,px,mw,mx)=>{
  x.font=px+"px "+FONT;
  const out=[];let ln="";
  for(const w of String(t).split(/(?<= )/)){
   if(x.measureText(ln+w).width<=mw){ln+=w;continue}
   if(ln){out.push(ln);ln=""}
   if(x.measureText(w).width<=mw){ln=w;continue}
   for(const ch of w){
    if(x.measureText(ln+ch).width>mw&&ln){out.push(ln);ln=ch}
    else ln+=ch
   }
  }
  if(ln)out.push(ln);
  return out.slice(0,mx||2)
 };

 const cols={no:M,img:M+46,name:M+150,qty:W-M-440,price:W-M-215,amt:W-M};
 const head=()=>{
  x.fillStyle="#1d2fa0";
  x.fillRect(M,y,W-2*M,50);
  T("#",24,cols.no+8,y+12,{col:"#fff",b:1});
  T(L("商品","Product"),24,cols.name,y+12,{col:"#fff",b:1});
  // 表头：替换为一维条码列（已修复减号）
  T(L("条码","Barcode"),24,cols.qty-135,y+12,{col:"#fff",b:1});
  T(L("数量","Qty"),24,cols.qty,y+12,{col:"#fff",b:1});
  T(L("单价/个","Cost/pc"),24,cols.price,y+12,{col:"#fff",b:1,al:"right"});
  T(L("小计","Amount"),24,cols.amt-10,y+12,{col:"#fff",b:1,al:"right"});
  y+=58
 };

 np();
 if(CFG.shop)T(CFG.shop,28,M,y,{col:"#555"}),y+=40;

 T(L("采购单","Purchase Order")+"  "+(p.no||L("(草稿)","(draft)")),50,M,y,{b:1});y+=76;
 T(L("供应商:","Supplier: ")+nm(sups,p.sup),28,M,y);y+=40;
 T(L("日期:","Date: ")+p.date,28,M,y);y+=42;
 const sp=byId(sups,p.sup);
 if(sp&&(sp.contact||sp.phone)){
  T([sp.contact,sp.phone].filter(Boolean).join("  "),24,M,y,{col:"#555"});
  y+=38
 }
 y+=14;
 head();

 for(let k=0;k<p.lines.length;k++){
  const l=p.lines[k],it=byId(items,l.pid)||{brand:"?"};
  if(y+RH>H-M-160){np();head()}
  if(k%2)(x.fillStyle="#f4f5f8",x.fillRect(M,y,W-2*M,RH));

  const im=await loadImg(imgOf(it));
  if(im){
   const s=Math.min(84/im.width,84/im.height);
   x.fillStyle="#fff";
   x.fillRect(cols.img,y+10,84,84);
   x.drawImage(im,cols.img+(84-im.width*s)/2,y+10+(84-im.height*s)/2,im.width*s,im.height*s)
  }

  // =========本行绘制【商品一维条码】，完全移除二维码ou/qrDraw代码 =========
  const bcText=it.code||"";
  const barData=barInfo(bcText);
  if(barData){
   const barDrawX=cols.qty-140;
   const barDrawY=y+8;
   const barH=32;
   const bw=1.2;
   let bx=barDrawX;
   for(let i=0;i<barData.bits.length;i++){
    if(barData.bits[i]==="1"){
     x.fillStyle="#000000";
     x.fillRect(bx,barDrawY,bw,barH);
    }
    bx+=bw;
   }
   //条码下方打印数字
   x.fillStyle="#000000";
   x.font="11px sans-serif";
   x.textAlign="center";
   x.fillText(bcText.slice(0,18), barDrawX+(barData.bits.length*bw)/2, barDrawY+barH+14);
   x.textAlign="left";
  }else{
   //无条码显示占位横线
   T("—",18,cols.qty-135,y+18);
  }
  // =================================================================

  // 修复：删掉ou变量引用，直接写20，不再判断ou
  const ln=wrap(pname(it),26,cols.qty-cols.name-20,2);
  ln.forEach((t,j)=>T(t,26,cols.name,y+10+j*32));

  T([it.sku&&"SKU "+it.sku,it.code].filter(Boolean).join("  "),20,cols.name,y+10+ln.length*32+2,{col:"#666"});

  const qt=l.unit==="box"?[l.qty+unitTxt(l),`${l.perBox||1}${L("个/箱","/box")} = ${lnPcs(l)}${L("个","pcs")}`]:[l.qty+unitTxt(l)];
  qt.forEach((t,j)=>T(t,24,cols.qty,y+14+j*30));

  T(money(l.cost),24,cols.price,y+36,{al:"right"});
  T(money(lnPcs(l)*l.cost),24,cols.amt-10,y+36,{al:"right",b:1});

  x.strokeStyle="#ddd";
  x.beginPath();
  x.moveTo(M,y+RH);
  x.lineTo(W-M,y+RH);
  x.stroke();
  y+=RH
 }

 y+=24;
 T(L("合计","Total")+": "+L(p.lines.length+" 项 · "+p.lines.reduce((a,l)=>a+lnPcs(l),0)+" 个",p.lines.length+" items · "+p.lines.reduce((a,l)=>a+lnPcs(l),0)+" pcs"),26,M,y+4);
 T(money(poTotal(p)),40,W-M-10,y,{al:"right",b:1});
 y+=70;

 if(p.note){
  wrap(L("备注: ","Note: ")+p.note,24,W-2*M,4).forEach(t=>{
   T(t,24,M,y,{col:"#444"});
   y+=34
  })
 }

 pages.forEach((pc,i)=>{
  const cx=pc.getContext("2d");
  cx.textBaseline="top";
  cx.font="20px "+FONT;
  cx.fillStyle="#888";
  cx.textAlign="center";
  cx.fillText((i+1)+" / "+pages.length,W/2,H-60)
 });

 const jp=pages.map(pc=>{
  const u=atob(pc.toDataURL("image/jpeg",.9).split(",")[1]),
  a=new Uint8Array(u.length);
  for(let i=0;i<u.length;i++)a[i]=u.charCodeAt(i);
  return{data:a,w:pc.width,h:pc.height}
 });
 return makePdf(jp)
}
function makePdf(jp){const enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let len=0;const push=u=>{parts.push(u);len+=u.length};
 const obj=(n,body)=>{offs[n]=len;push(enc(n+" 0 obj\n"+body+"\nendobj\n"))};

const REP={};

ACT["rep-exp"]=k=>{const r=REP[k](LST[k].rows());outXlsx(r.rows,r.name,r.hdr)};
PG["rep-stock"]=()=>repPage("rep-stock",L("库存报表","Stock report"),{data:()=>items,fields:pFields(),filters:pFilters(),hay:i=>[pname(i),i.code,i.sku,nm(cats,i.cat),nm(sups,i.sup)].join(" "),tabs:TABS["rep-stock"],cols:[{h:["商品","Product"],f:(i,t)=>hl(pname(i),t)},{h:["分类","Category"],f:i=>esc(nm(cats,i.cat))},{h:["供应商","Supplier"],f:i=>esc(nm(sups,i.sup))},{h:["货架","Shelf"],cls:"num",f:i=>i.qs},{h:["仓库","Warehouse"],cls:"num",f:i=>i.qw},{h:["合计","Total"],cls:"num",f:i=>i.qty},{h:["最低库存","Min"],cls:"num",f:i=>i.min},{h:["成本","Cost"],cls:"num",f:i=>money(i.cost)},{h:["库存成本","Value"],cls:"num",f:i=>money(i.qty*i.cost)},{h:["状态","Status"],f:tagS}],
 exp:r=>({name:"stock-report.xlsx",hdr:["Product","Barcode","Category","Supplier","Shelf","Warehouse","Total","Min","Cost","Stock Value","Status"],rows:r.map(i=>[pname(i),i.code,i.sku,nm(cats,i.cat),nm(sups,i.sup),i.qs,i.qw,i.qty,i.min,i.cost,+(i.qty*i.cost).toFixed(2),stat(i)])})});
const poFlat=()=>{const a=[];pos.forEach(p=>p.lines.forEach(l=>{const it=byId(items,l.pid);a.push({no:p.no,date:p.date,sup:nm(sups,p.sup),st:p.status,name:it?pname(it):"?",qty:lnPcs(l),cost:l.cost,amt:lnPcs(l)*l.cost})}));return a.sort((x,y)=>y.date.localeCompare(x.date))};
PG["rep-exp"]=()=>repPage("rep-exp",L("效期报表","Expiry report"),{data:()=>batches.filter(b=>b.qs+b.qw>0),fields:pFields(bItem),filters:pFilters(bItem),hay:b=>{const i=bItem(b);return[pname(i),i.code,i.sku,nm(cats,i.cat),nm(sups,i.sup),b.ref,b.exp].join(" ")},tabs:TABS["rep-exp"],
 cols:[{h:["商品","Product"],f:(b,t)=>hl(pname(bItem(b)),t)},{h:["SKU","SKU"],f:b=>esc(bItem(b).sku)},{h:["来源","Source"],f:b=>esc(b.ref||b.rcv)},{h:["生产日期","Production"],f:b=>esc(b.mfg)},{h:["到期日期","Expiry"],f:b=>esc(b.exp)},{h:["剩余天数","Days"],cls:"num",f:b=>dleftD(b.exp)==null?"":dleftD(b.exp)},{h:["货架","Shelf"],cls:"num",f:b=>b.qs},{h:["仓库","Warehouse"],cls:"num",f:b=>b.qw},{h:["状态","Status"],f:bTag}],
 exp:r=>({name:"expiry-report.xlsx",hdr:["Product","SKU","Barcode","Source","Production Date","Expiry Date","Days Left","Shelf","Warehouse","Status"],rows:r.map(b=>{const i=bItem(b);return[pname(i),i.sku,i.code,b.ref||b.rcv,b.mfg,b.exp,dleftD(b.exp),b.qs,b.qw,bExpS(b)]})})});
PG["rep-buy"]=()=>repPage("rep-buy",L("采购报表","Purchase report"),{data:poFlat,hay:r=>[r.no,r.sup,r.name].join(" "),cols:[{h:["单号","No."],f:(r,t)=>hl(r.no,t)},{h:["日期","Date"],f:r=>esc(r.date)},{h:["供应商","Supplier"],f:(r,t)=>hl(r.sup,t)},{h:["商品","Product"],f:(r,t)=>hl(r.name,t)},{h:["数量","Qty"],cls:"num",f:r=>r.qty},{h:["单价","Cost"],cls:"num",f:r=>money(r.cost)},{h:["金额","Amount"],cls:"num",f:r=>money(r.amt)},{h:["状态","Status"],f:r=>tagP(r.st)}],
 exp:r=>({name:"purchase-report.xlsx",hdr:["PO No","Date","Supplier","Product","Qty","Cost","Amount","Status"],rows:r.map(x=>[x.no,x.date,x.sup,x.name,x.qty,x.cost,+x.amt.toFixed(2),x.st])})});
const varFlat=()=>{const a=[];hist.forEach(h=>h.lines.forEach(l=>a.push({d:h.d,name:l.name,code:l.code,b:l.before,a:l.after,v:l.after-l.before})));return a.filter(x=>x.v!==0)};
PG["rep-var"]=()=>repPage("rep-var",L("盘点差异报表","Variance report"),{data:varFlat,hay:r=>[r.name,r.code,r.d].join(" "),cols:[{h:["时间","Time"],f:r=>esc(r.d)},{h:["商品","Product"],f:(r,t)=>hl(r.name,t)},{h:["条码","Barcode"],f:r=>esc(r.code)},{h:["盘点前","Before"],cls:"num",f:r=>r.b},{h:["盘点后","After"],cls:"num",f:r=>r.a},{h:["差异","Diff"],cls:"num",f:r=>`<span class="tag ${r.v<0?"r":"o"}">${r.v>0?"+":""}${r.v}</span>`}],
 exp:r=>({name:"variance-report.xlsx",hdr:["Time","Product","Barcode","Before","After","Diff"],rows:r.map(x=>[x.d,x.name,x.code,x.b,x.a,x.v])})});
PG["rep-margin"]=()=>repPage("rep-margin",L("商品毛利报表","Margin report"),{data:()=>items,hay:i=>pname(i)+" "+i.code,cols:[{h:["商品","Product"],f:(i,t)=>hl(pname(i),t)},{h:["成本","Cost"],cls:"num",f:i=>money(i.cost)},{h:["会员价","Member"],cls:"num",f:i=>money(i.mp)},{h:["会员毛利","Margin"],cls:"num",f:i=>money(i.mp-i.cost)},{h:["毛利率","%"],cls:"num",f:i=>i.mp?Math.round((i.mp-i.cost)/i.mp*100)+"%":"—"},{h:["非会员价","Non-member"],cls:"num",f:i=>money(i.np)},{h:["非会员毛利","Margin"],cls:"num",f:i=>money(i.np-i.cost)}],
 exp:r=>({name:"margin-report.xlsx",hdr:["Product","Cost","Member Price","Member Margin","Non-member Price","Non-member Margin"],rows:r.map(i=>[pname(i),i.cost,i.mp,+(i.mp-i.cost).toFixed(2),i.np,+(i.np-i.cost).toFixed(2)])})});
/* ===== settings ===== */
PG["set-shop"]=()=>main(head(L("店铺信息","Shop info"))+`<div class="card"><div class="fg">${F("shop","店铺名称","Shop name",CFG.shop)}${F("phone","联系电话","Phone",CFG.phone)}${F("addr","地址","Address",CFG.addr,{w:"full"})}${F("appurl","系统网址(商品二维码里的链接)","App URL (used in product QR links)",CFG.appUrl,{w:"full"})}<div class="fld full"><span class="muted">${L("留空就用当前网址:","Blank = current address: ")}${esc(defAppUrl()||L("(在聊天预览里打开时无法自动识别,请手动填写你的 GitHub Pages 网址)","(cannot be detected inside the chat preview — enter your GitHub Pages URL)"))}</span></div>${F("ophone","接收订单的 WhatsApp 号码(含国家区号,如 6591234567)","Order WhatsApp number (with country code)",CFG.ophone)}</div><div class="row" style="margin-top:12px"><button class="btn pri" data-act="shop-save">${L("保存","Save")}</button></div></div>`);
ACT["shop-save"]=()=>{CFG.shop=V("shop");CFG.phone=V("phone");CFG.addr=V("addr");CFG.appUrl=V("appurl");CFG.ophone=V("ophone").replace(/\D/g,"");SAVE.cfg();toast(L("已保存","Saved"));render()};
PG["set-lang"]=()=>main(head(L("语言与显示","Language & display"))+`<div class="card"><div class="fg">${F("lang","界面语言","Language",LANG,{type:"select",opts:[["zh","中文"],["en","English"]]})}${F("psize","列表默认每页条数","Default rows per page",CFG.psize,{type:"select",opts:[5,10,15,20].map(v=>[v,v])})}${F("expwarn","默认临期提醒天数","Default expiry warning days",CFG.expWarn,{type:"number"})}</div><div class="row" style="margin-top:12px"><button class="btn pri" data-act="lang-save">${L("保存","Save")}</button></div></div>`);
ACT["lang-save"]=()=>{CFG.psize=+V("psize")||10;CFG.expWarn=Math.max(1,Math.round(+V("expwarn")||30));SAVE.cfg();Object.keys(LST).forEach(k=>LST[k].st.size=CFG.psize);LANG=V("lang")==="en"?"en":"zh";try{localStorage.setItem("lang1",LANG)}catch(e){}buildModal();toast(L("已保存","Saved"));render()};
let pendImp=null;
const dataKB=()=>Math.round(JSON.stringify({items,sups,hist,cats,staff,roles,pos,locs,moves,batches,CFG}).length/1024);
PG["set-data"]=()=>{pendImp=null;const rows=[[L("商品","Products"),items.length],[L("供应商","Suppliers"),sups.length],[L("采购单","Orders"),pos.length],[L("员工","Staff"),staff.length],[L("角色","Roles"),roles.length],[L("分类","Categories"),cats.length],[L("盘点记录","Stocktakes"),hist.length],[L("库位","Locations"),locs.length],[L("库存批次","Batches"),batches.length],[L("库存流水","Movements"),moves.length]];
 main(head(L("数据导入导出","Data backup"))+`<div class="card"><h3>${L("当前本地数据","Local data")} (${dataKB()} KB)</h3><div class="kpis" style="margin-bottom:0">${rows.map(r=>kpi(r[0],r[1])).join("")}</div></div>
 <div class="card"><h3>${L("导出全部数据","Export all data")}</h3><p class="muted">${L("把商品(含图片)、供应商、采购单、会员、分类、盘点记录和设置打包成一个 JSON 文件。建议定期备份;iPhone 导出时会弹出分享面板,选“存储到文件”。","One JSON file with everything. Back up regularly.")}</p><button class="btn pri" data-act="data-exp">⬇ ${L("导出全部数据","Export all")}</button></div>
 <div class="card"><h3>${L("导入数据","Import data")}</h3><div class="fg">${F("mode","导入方式","Mode",'replace',{type:"select",opts:[["replace",L("覆盖(清除现有数据,以文件为准)","Replace all")],["merge",L("合并(只添加文件里新增的记录)","Merge (add new records only)")]]})}<label class="fld"><span>${L("选择备份文件 (.json)","Backup file (.json)")}</span><input class="in" type="file" id="imp_json" accept=".json,application/json"></label></div><div id="imp_msg" style="margin-top:10px"></div></div>
 <div class="card"><h3>${L("清空数据","Clear data")}</h3><p class="muted">${L("删除本机所有商品、供应商、采购单等数据,不可恢复。请先导出备份。","Delete everything on this device. Back up first.")}</p><button class="btn red" data-act="data-clear">${L("清空全部数据","Clear all")}</button></div>`)};
ACT["data-exp"]=async()=>{const d={app:"shop-manager",v:8,at:new Date().toISOString(),lang:LANG,data:{items,sups,hist,cats,staff,roles,pos,locs,moves,batches,cfg:CFG}};
 try{await saveFile("shop-data-"+today()+".json",JSON.stringify(d),"application/json");toast(L("已导出","Exported"))}catch(e){toast(e&&(e.code==="declined"||e.name==="AbortError")?L("已取消","Cancelled"):L("导出失败","Export failed"))}};
document.addEventListener("change",async e=>{if(e.target.id!=="imp_json")return;const f=e.target.files[0];if(!f)return;const m=$("imp_msg");
 try{const d=JSON.parse(await f.text());if(d.app!=="shop-manager"||!d.data)throw 0;pendImp=d.data;const n=k=>(d.data[k]||[]).length;
  m.innerHTML=`<p>${L("文件内容","File")}: ${L("商品","Products")} ${n("items")}, ${L("供应商","Suppliers")} ${n("sups")}, ${L("采购单","Orders")} ${n("pos")}, ${L("员工","Staff")} ${n("staff")}, ${L("盘点记录","Stocktakes")} ${n("hist")}</p><button class="btn pri" data-act="data-imp-ok">${L("确认导入","Confirm import")}</button>`}
 catch(err){pendImp=null;m.innerHTML=`<span class="tag r">${L("不是有效的备份文件","Not a valid backup file")}</span>`}e.target.value=""});
ACT["data-imp-ok"]=(_,el)=>cf(el,()=>{const d=pendImp;if(!d)return;const mode=V("mode");
 const mg=(c,inc)=>{const h=new Set(c.map(x=>String(x.id)));return c.concat((inc||[]).filter(x=>!h.has(String(x.id))))};
 if(mode==="replace"){items=d.items||[];sups=d.sups||[];hist=d.hist||[];cats=d.cats||[];staff=d.staff||[];roles=d.roles&&d.roles.length?d.roles:roles;locs=d.locs||[];moves=d.moves||[];batches=d.batches||[];pos=d.pos||[];if(d.cfg)CFG=Object.assign(CFG,d.cfg)}
 else{items=mg(items,d.items);sups=mg(sups,d.sups);hist=mg(hist,d.hist);cats=mg(cats,d.cats);staff=mg(staff,d.staff);roles=mg(roles,d.roles);locs=mg(locs,d.locs);moves=mg(moves,d.moves);batches=mg(batches,d.batches);pos=mg(pos,d.pos)}
 norm();Object.values(SAVE).forEach(f=>f());pendImp=null;toast(L("导入完成","Import done"));render()});
ACT["data-clear"]=(_,el)=>cf(el,()=>{items=[];sups=[];hist=[];cats=[];staff=[];pos=[];roles=defRoles();locs=[];moves=[];batches=[];Object.values(SAVE).forEach(f=>f());toast(L("已清空","Cleared"));render()});
PG["set-about"]=()=>main(head(L("关于系统","About"))+`<div class="card"><p><b>${L("杂货店管理系统","Provision Shop Manager")}</b> v8.0</p><p class="muted">${L("商品、价签、供应商、采购、盘点、报表一体化。数据保存在本机浏览器,请定期到“设置 › 数据导入导出”备份。","All-in-one: products, labels, suppliers, purchasing, stocktake and reports. Data stays in this browser.")}</p></div><div class="card"><h3>${L("菜单结构","Menu map")}</h3>${MENU.map(m=>`<p><b>${m.i} ${L(m.z,m.e)}</b>：${m.c.map(c=>L(c.z,c.e)).join(" / ")}</p>`).join("")}</div>`);
/* ===== boot ===== */
buildModal();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!location.hash)location.hash="home";
render();

</script></body></html>
