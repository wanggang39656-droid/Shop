<div class="app"><nav class="side" id="side"></nav><div class="mask" id="mask"></div><div class="main"><div class="top"><button class="btn burger" data-act="burger">☰</button><div class="crumb" id="crumb"></div><button class="btn sm" id="langbtn" data-act="lang"></button><button class="btn sm red" id="logoutbtn" data-act="logout" style="display:none"></button></div><div class="content" id="main"></div></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG="zh";try{LANG=localStorage.getItem("lang1")==="en"?"en":"zh"}catch(e){}
const L=(z,e)=>LANG==="zh"?z:e;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast(L("存储空间不足,保存失败","Storage full, save failed"));return false}};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmtD(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmtD(d)};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}

/* ---------- IndexedDB Image Store & Blob URL Manager ---------- */
const ImgDB = {
  db: null,
  ok: true,
  init() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) { this.ok = false; toast(L("当前浏览器不支持 IndexedDB，图片存储不可用", "IndexedDB unsupported, image storage disabled")); return res(false); }
        const req = indexedDB.open("ShopManagerImgDB", 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
        };
        req.onsuccess = e => { this.db = e.target.result; this.ok = true; res(true); };
        req.onerror = () => { this.ok = false; toast(L("无痕/隐私模式下 IndexedDB 不可用，图片保存将失效", "IndexedDB unavailable in private mode, image saving disabled")); res(false); };
      } catch (err) {
        this.ok = false;
        toast(L("IndexedDB 初始化异常，图片保存将失效", "IndexedDB error, image saving disabled"));
        res(false);
      }
    });
  },
  put(id, blob) {
    return new Promise(res => {
      if (!this.ok || !this.db) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");
        tx.objectStore("images").put(blob, id);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(id) {
    return new Promise(res => {
      if (!this.ok || !this.db || !id) return res(null);
      try {
        const tx = this.db.transaction("images", "readonly");
        const req = tx.objectStore("images").get(id);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  del(id) {
    return new Promise(res => {
      if (!this.ok || !this.db || !id) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");
        tx.objectStore("images").delete(id);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  all() {
    return new Promise(res => {
      if (!this.ok || !this.db) return res({});
      try {
        const tx = this.db.transaction("images", "readonly");
        const st = tx.objectStore("images");
        const kr = st.getAllKeys(), vr = st.getAll();
        tx.oncomplete = () => {
          const out = {};
          (kr.result || []).forEach((k, idx) => { out[k] = vr.result[idx]; });
          res(out);
        };
        tx.onerror = () => res({});
      } catch (e) { res({}); }
    });
  },
  clear() {
    return new Promise(res => {
      if (!this.ok || !this.db) return res(false);
      try {
        const tx = this.db.transaction("images", "readwrite");
        tx.objectStore("images").clear();
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
};

const BlobPool = {
  urls: new Set(),
  create(blob) {
    if (!blob) return "";
    const u = URL.createObjectURL(blob);
    this.urls.add(u);
    return u;
  },
  revoke(u) {
    if (u && this.urls.has(u)) {
      URL.revokeObjectURL(u);
      this.urls.delete(u);
    }
  },

function revokeContainerBlobs(root) {
  if (!root) return;
  root.querySelectorAll("img").forEach(img => {
    if (img.src && img.src.startsWith("blob:")) {
      BlobPool.revoke(img.src);
      img.removeAttribute("src");
    }
  });
}

async function hydrateImages(root = document) {
  const els = root.querySelectorAll("img[data-imgid]");
  for (const el of els) {
    const id = el.getAttribute("data-imgid");
    if (!id) continue;
    if (el.dataset.loadedId === id && el.src && el.src.startsWith("blob:")) continue;
    if (el.src && el.src.startsWith("blob:")) BlobPool.revoke(el.src);
    const blob = await ImgDB.get(id);
    if (blob) {
      el.src = BlobPool.create(blob);
      el.dataset.loadedId = id;
    }
  }
}

async function releaseUnusedImg(imgId) {
  if (!imgId) return;
  const inUse = items.some(it => it.img === imgId);
  if (!inUse) await ImgDB.del(imgId);
}

async function compressToBlob(source) {
  const url = source instanceof Blob ? URL.createObjectURL(source) : source;
  const im = await new Promise(r => {
    const m = new Image();
    m.onload = () => r(m);
    m.onerror = () => r(null);
    m.src = url;
  });
  if (source instanceof Blob) URL.revokeObjectURL(url);
  if (!im) return null;
  const k = Math.min(1, 600 / Math.max(im.width, im.height));
  const c = document.createElement("canvas");
  c.width = Math.round(im.width * k);
  c.height = Math.round(im.height * k);
  const x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.85));
}

function migrateOldGoods() {
  let changed = false;
  items.forEach(it => {
    const hasLegacy = ("sup" in it) || ("code" in it) || ("cost" in it);
    if (!Array.isArray(it.supplierItems)) {
      it.supplierItems = [];
      const supId = it.sup ? String(it.sup) : "";
      const code = String(it.code || "").trim();
      const cost = +it.cost || 0;
      if (supId || code || cost > 0) {
        it.supplierItems.push({
          supId,
          supName: supId ? nm(sups, supId) : "",
          barcode: code,
          cost,
          note: ""
        });
      }
      changed = true;
    } else {
      it.supplierItems.forEach(si => {
        if (si.sup !== undefined && si.supId === undefined) { si.supId = String(si.sup || ""); delete si.sup; changed = true; }
        if (si.code !== undefined && si.barcode === undefined) { si.barcode = String(si.code || ""); delete si.code; changed = true; }
        if (si.supId && !si.supName) { si.supName = nm(sups, si.supId); changed = true; }
        if (si.note === undefined) { si.note = ""; changed = true; }
        si.cost = +si.cost || 0;
      });
    }
    if (hasLegacy) {
      delete it.sup;
      delete it.code;
      delete it.cost;
      changed = true;
    }
  });
  if (changed) SAVE.items();
}

async function exportAllImagesZip() {
  if (!ImgDB.ok) {
    toast(L("IndexedDB 不可用，无法导出图片", "IndexedDB unavailable"));
    return;
  }
  if (typeof JSZip === "undefined") {
    toast(L("JSZip 组件未加载，请检查网络", "JSZip not loaded"));
    return;
  }
  const all = await ImgDB.all();
  const keys = Object.keys(all);
  if (!keys.length) {
    toast(L("暂无已保存的图片", "No images to export"));
    return;
  }
  toast(L("正在打包图片 ZIP…", "Zipping images…"));
  const zip = new JSZip();
  const folder = zip.folder("shop_images");
  const usedNames = new Set();
  const imgToProducts = new Map();

  items.forEach(it => {
    const imgId = imgOf(it);
    if (!imgId) return;
    if (!imgToProducts.has(imgId)) imgToProducts.set(imgId, []);
    imgToProducts.get(imgId).push(it);
  });

  const getExt = blob => {
    const t = (blob && blob.type || "").toLowerCase();
    if (t.includes("png")) return "png";
    if (t.includes("webp")) return "webp";
    return "jpg";
  };

  const uniqueFilename = (base, ext) => {
    const clean = sanitizeFilename(base) || "image";
    let candidate = `${clean}.${ext}`;
    let idx = 2;
    while (usedNames.has(candidate.toLowerCase())) {
      candidate = `${clean}_${idx}.${ext}`;
      idx++;
    }
    usedNames.add(candidate.toLowerCase());
    return candidate;
  };

  let totalFiles = 0;
  keys.forEach(imgId => {
    const blob = all[imgId];
    if (!blob) return;
    const ext = getExt(blob);
    const linked = imgToProducts.get(imgId);
    if (linked && linked.length > 0) {
      linked.forEach(it => {
        const gName = sanitizeFilename(pname(it)) || sanitizeFilename(it.brand) || imgId;
        const gCode = sanitizeFilename(itemPrimaryCode(it));
        const baseName = gCode ? `${gName}_${gCode}` : gName;
        const fname = uniqueFilename(baseName, ext);
        folder.file(fname, blob);
        totalFiles++;
      });
    } else {
      const fname = uniqueFilename(imgId, ext);
      folder.file(fname, blob);
      totalFiles++;
    }
  });

  try {
    const content = await zip.generateAsync({ type: "blob" });
    await saveFile(`shop-images-${today()}.zip`, content, "application/zip");
    toast(L(`已导出 ${totalFiles} 个图片文件`, `Exported ${totalFiles} image files`));
  } catch (e) {
    toast(L("导出 ZIP 失败", "ZIP export failed"));
  }
}

 if(unit==="box"&&!(it.box>1))unit="pc";
 const pcs=unit==="box"?q*it.box:q;
 const supEntry=poD.sup?itemEntryForSup(it,poD.sup):itemPrimaryEntry(it);

 const lineBarcode=(supEntry&&supEntry.barcode)?supEntry.barcode:itemPrimaryCode(it);
 const l=poD.lines.find(x=>String(x.pid)===String(it.id));

}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast(L("已复制,可粘贴到微信 / WhatsApp","Copied"))}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(L("已复制","Copied"))}catch(_){toast(L("复制失败","Copy failed"))}a.remove()}}
ACT["po-txt"]=id=>copyText(poText(byId(pos,id)));
ACT["po-txt-draft"]=()=>copyText(poText(Object.assign({},poD,{sup:V("sup")||poD.sup})));
ACT["po-xlsx-draft"]=()=>exportPoExcel(Object.assign({},poD,{sup:V("sup")||poD.sup,date:V("date")||poD.date,note:V("note")}));
ACT["po-print"]=id=>{const p=byId(pos,id);const w=window.open("","_blank");if(!w){toast(L("请允许本页弹窗后再试","Allow pop-ups and retry"));return}
 w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(p.no)}</title><style>body{font-family:sans-serif;padding:20px;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:middle}.r{text-align:right}.bcbox{width:140px;height:38px}.bcbox svg{width:100%;height:100%;display:block}</style><h2>${L("采购单","Purchase order")} ${esc(p.no)}</h2><p>${L("供应商","Supplier")}: ${esc(nm(sups,p.sup))} &nbsp; ${L("日期","Date")}: ${esc(p.date)}</p><table><tr><th>#</th><th>${L("商品","Product")}</th><th>${L("商品条码","Barcode")}</th><th>${L("数量","Qty")}</th><th class="r">${L("单价/个","Cost/pc")}</th><th class="r">${L("小计","Amount")}</th></tr>${p.lines.map((l,k)=>{const it=byId(items,l.pid),bc=poLineBarcode(l,p);return`<tr><td>${k+1}</td><td>${it?esc(pname(it)):"?"}</td><td>${bc&&barInfo(bc)?`<div class="bcbox">${eanSvg(bc)}</div><div style="font-size:11px;font-family:monospace">${esc(bc)}</div>`:esc(bc||"—")}</td><td>${esc(lnTxt(l))}</td><td class="r">${money(l.cost)}</td><td class="r">${money(lnPcs(l)*l.cost)}</td></tr>`}).join("")}<tr><td colspan="5" class="r"><b>${L("合计","Total")}</b></td><td class="r"><b>${money(poTotal(p))}</b></td></tr></table><p>${esc(p.note||"")}</p>`);w.document.close();setTimeout(()=>w.print(),500)};

/* detail / receive */
PG["po-detail"]=id=>{const p=byId(pos,id);if(!p){main(`<div class="empty">${L("采购单不存在","Not found")}</div>`);return}
 const rcv=p.status==="ordered"||p.status==="partial";
 main(head(esc(p.no)+" "+tagP(p.status),`${bk}po-list">← ${L("返回","Back")}</button>${p.status==="draft"?`<button class="btn" data-go="po-edit-${p.id}">${L("编辑","Edit")}</button><button class="btn pri" data-act="po-st" data-id="${p.id}|ordered">${L("下单","Place order")}</button>`:""}<button class="btn" data-act="po-txt" data-id="${p.id}">${L("复制文本","Copy text")}</button><button class="btn" data-act="po-xlsx" data-id="${p.id}">Excel</button><button class="btn pri" data-act="po-pdf" data-id="${p.id}">📄 ${L("生成 PDF","PDF")}</button><button class="btn" data-act="po-print" data-id="${p.id}">${L("打印","Print")}</button><button class="btn" data-act="po-copy" data-id="${p.id}">${L("复制为新单","Duplicate")}</button>${p.status==="draft"||p.status==="ordered"?`<button class="btn red" data-act="po-st" data-id="${p.id}|cancelled">${L("取消","Cancel")}</button>`:""}`)+
 `<div class="card"><div class="dgrid3">${dg(L("供应商","Supplier"),p.sup?`<a class="lnk" data-go="sup-detail-${p.sup}">${esc(nm(sups,p.sup))}</a>`:"")}${dg(L("日期","Date"),esc(p.date))}${dg(L("合计","Total"),money(poTotal(p)))}${dg(L("总件数","Pieces"),p.lines.reduce((a,l)=>a+lnPcs(l),0))}${dg(L("完成入库","Received"),esc(p.rcv))}${dg(L("备注","Note"),esc(p.note))}</div></div>
 <div class="card"><h3>${L("明细与收货核对","Lines & Receiving")}</h3><div class="tw"><table class="rt"><thead><tr><th>${L("商品","Product")}</th><th>${L("商品条码","Barcode")}</th><th>${L("订购","Ordered")}</th><th class="num">${L("单价/个","Cost/pc")}</th><th class="num">${L("小计","Amount")}</th><th class="num">${L("已收(个)","Received")}</th>${rcv?`<th class="num">${L("本次实收(个)","Receive now")}</th><th>${L("生产日期","Production")}</th><th>${L("到期日期","Expiry")}</th>`:""}</tr></thead><tbody>${p.lines.map((l,k)=>{const it=byId(items,l.pid),bc=poLineBarcode(l,p),rest=Math.max(0,lnPcs(l)-(l.rcv||0));return`<tr><td data-label="${L("商品","Product")}">${it?pcell(it,[],""):"?"}</td><td data-label="${L("商品条码","Barcode")}">${bc&&barInfo(bc)?`<div class="bcm">${eanSvg(bc)}</div><div class="bcn">${esc(bc)}</div>`:`<code>${esc(bc||"—")}</code>`}</td><td data-label="${L("订购","Ordered")}">${esc(lnTxt(l))}</td><td class="num" data-label="${L("单价/个","Cost/pc")}">${money(l.cost)}</td><td class="num" data-label="${L("小计","Amount")}">${money(lnPcs(l)*l.cost)}</td><td class="num" data-label="${L("已收(个)","Received")}">${l.rcv||0}</td>${rcv?`<td class="num" data-label="${L("本次实收(个)","Receive now")}"><input class="in" type="number" min="0" id="rc_${k}" value="${rest}"></td><td data-label="${L("生产日期","Production")}"><input class="in" style="width:140px" type="date" id="rm_${k}"></td><td data-label="${L("到期日期","Expiry")}"><input class="in" style="width:140px" type="date" id="rx_${k}"></td>`:""}</tr>`}).join("")}</tbody></table></div>${rcv?`<div class="row" style="margin-top:12px"><button class="btn pri" data-act="po-recv" data-id="${p.id}">${L("确认入库(入仓库)","Confirm receipt (to warehouse)")}</button>${p.status==="partial"?`<button class="btn" data-act="po-close" data-id="${p.id}">${L("结束收货","Close order")}</button>`:""}</div><p class="muted">${L("实收数量以“个”为单位,默认是尚未收到的数量;每次来货的生产日期和到期日期不同,请逐项填写,系统会建成独立批次;入库后会进入仓库库存,再到“库存操作”里上架到货架。","Quantities in pieces; goods go to the warehouse, then shelve them in Stock operations.")}</p>`:""}</div>`)};
ACT["po-st"]=v=>{const[id,s]=v.split("|"),p=byId(pos,id);p.status=s;SAVE.pos();render()};
ACT["po-close"]=id=>{const p=byId(pos,id);p.status="received";p.rcv=today();SAVE.pos();render()};
ACT["po-recv"]=id=>{const p=byId(pos,id);let any=0;
 p.lines.forEach((l,k)=>{const x=Math.max(0,Math.round(+($("rc_"+k)||{}).value||0));if(!x)return;const it=byId(items,l.pid);if(!it)return;any++;
  if(l.cost>0&&p.sup){const se=it.supplierItems.find(s=>String(s.supId)===String(p.sup));if(se)se.cost=l.cost}
  const ex=($("rx_"+k)||{}).value,mf=($("rm_"+k)||{}).value;addBatch(it,0,x,mf,ex,p.no);logMove(it,"po_in",0,x,p.no+(ex?" · "+L("到期 ","exp ")+ex:""));
  l.rcv=(l.rcv||0)+x});
 if(!any){toast(L("请输入本次实收数量","Enter the received quantity"));return}
 const done=p.lines.every(l=>(l.rcv||0)>=lnPcs(l));p.status=done?"received":"partial";if(done)p.rcv=today();
 SAVE.items();SAVE.batches();SAVE.pos();SAVE.moves();toast(done?L("已全部入库","All received"):L("已部分入库","Partially received"));render()};

/* reorder */
const reRows=()=>items.filter(i=>i.min>0&&i.qty<=i.min).map(i=>({i,q:sugP(i)}));
PG["po-reorder"]=()=>mount("po-reorder",{data:reRows,hay:r=>pname(r.i)+" "+itemSupNames(r.i).join(" "),cols:[{h:["商品","Product"],f:(r,t)=>pcell(r.i,t,"")},{h:["供应商","Supplier"],f:r=>{const sn=itemSupNames(r.i);return sn.length?esc(sn.join("、")):`<span class="tag r">${L("未指定","None")}</span>`}},{h:["库存","Stock"],f:r=>`${L("货架","Shelf")} ${r.i.qs} · ${L("仓库","WH")} ${r.i.qw}`},{h:["最低库存","Min"],cls:"num",f:r=>r.i.min},{h:["建议订货","Suggested"],f:r=>sugTxt(r.i)},{h:["单价/个","Cost/pc"],cls:"num",f:r=>money(itemCost(r.i))},{h:["金额","Amount"],cls:"num",f:r=>money(r.q*itemCost(r.i))}],
 pre:`<p class="muted" style="margin-top:0">${L("当前库存 ≤ 最低库存的商品,自动按供应商生成采购单草稿。","Items at or below minimum stock; drafts are grouped by supplier.")}</p>`,
 tool:`<button class="btn pri" data-act="re-make">⚡ ${L("按供应商生成采购单草稿","Generate draft POs")}</button>`},head(L("补货建议","Reorder")));
ACT["re-make"]()=>{const byS={};reRows().forEach(({i,q})=>{const sids=itemSupIds(i);const k=sids[0]||"";(byS[k]=byS[k]||[]).push({i,q})});
 const ks=Object.keys(byS);if(!ks.length){toast(L("目前没有需要补货的商品","Nothing needs reorder"));return}
 const d=today();let n=0;ks.forEach(k=>{if(!k)return;const p={id:uid(),no:poNo(d),sup:k,date:d,note:L("补货建议自动生成","Auto-generated from reorder"),status:"draft",lines:byS[k].map(({i,q})=>{const se=itemEntryForSup(i,k);const c=(se&&se.cost>0)?se.cost:itemCost(i);const bc=(se&&se.barcode)?se.barcode:itemPrimaryCode(i);return i.box>1&&q>=i.box?{pid:i.id,barcode:bc,qty:Math.ceil(q/i.box),unit:"box",perBox:i.box,cost:c}:{pid:i.id,barcode:bc,qty:q,unit:"pc",perBox:i.box||1,cost:c}})};pos.push(p);n++});
 SAVE.pos();toast(n?L("已生成 "+n+" 张采购单草稿","Created "+n+" draft POs"):L("缺货商品尚未指定供应商","Assign suppliers to those products first"));go("po-list")};

 cols:[{h:["商品","Product"],f:(i,t)=>`<a class="lnk" data-go="prod-detail-${i.id}">${hl(pname(i),t)}</a>`},{h:["供应商","Supplier"],f:i=>esc(itemSupNames(i).join("、"))},{h:["货架","Shelf"],cls:"num",f:i=>i.qs},{h:["仓库","Warehouse"],cls:"num",f:i=>i.qw},{h:["合计","Total"],cls:"num",f:i=>i.qty},{h:["最低库存","Min"],cls:"num",f:i=>i.min},{h:["单位成本","Cost"],cls:"num",f:i=>money(itemCost(i))},{h:["库存成本","Stock cost"],cls:"num",f:i=>money(i.qty*itemCost(i))},{h:["零售值","Retail"],cls:"num",f:i=>money(i.qty*i.np)},{h:["状态","Status"],f:tagS}],

PG["rep-buy"]=()=>{const st=S["rep-buy"]||(S["rep-buy"]={f:"",t:"",q:"",pg:1,size:CFG.psize||10});
 const rows=()=>pos.filter(p=>(!st.f||p.date>=st.f)&&(!st.t||p.date<=st.t)&&(!st.q||nm(sups,p.sup).toLowerCase().includes(st.q.toLowerCase())||p.no.toLowerCase().includes(st.q.toLowerCase()))).sort((a,b)=>b.id-a.id);
 main(head(L("采购报表","Purchase report"))+`<div class="card"><div class="tb"><input class="in" id="rb_q" placeholder="${L("供应商 / 单号","Supplier / PO no.")}" value="${esc(st.q)}"><input class="in sm" type="date" id="rb_f" value="${esc(st.f)}"><input class="in sm" type="date" id="rb_t" value="${esc(st.t)}"><button class="btn" data-act="r-buy">⬇ ${L("导出 Excel","Export Excel")}</button></div><div class="kpis" id="rb_k"></div><div id="rb_w"></div></div>`);
 const paint=()=>{const r=rows(),val=r.filter(p=>p.status!=="cancelled").reduce((a,p)=>a+poTotal(p),0);
  $("rb_k").innerHTML=kpi(L("单据数","Orders"),r.length)+kpi(L("采购金额(不含取消)","Amount"),money(val))+kpi(L("已入库","Received"),r.filter(p=>p.status==="received").length);
  $("rb_w").innerHTML=r.length?`<div class="tw"><table class="rt"><thead><tr><th>${L("单号","No.")}</th><th>${L("供应商","Supplier")}</th><th>${L("日期","Date")}</th><th class="num">${L("金额","Amount")}</th><th>${L("状态","Status")}</th></tr></thead><tbody>${r.map(p=>`<tr><td data-label="${L("单号","No.")}"><a class="lnk" data-go="po-detail-${p.id}">${esc(p.no)}</a></td><td data-label="${L("供应商","Supplier")}">${esc(nm(sups,p.sup))}</td><td data-label="${L("日期","Date")}">${esc(p.date)}</td><td class="num" data-label="${L("金额","Amount")}">${money(poTotal(p))}</td><td data-label="${L("状态","Status")}">${tagP(p.status)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${L("暂无数据","No data")}</div>`};
 paint();["rb_q","rb_f","rb_t"].forEach(id=>$(id).oninput=$(id).onchange=()=>{st.q=$("rb_q").value;st.f=$("rb_f").value;st.t=$("rb_t").value;paint()});
 ACT["r-buy"]=()=>outXlsx(rows().map(p=>[p.no,nm(sups,p.sup),p.date,poTotal(p),p.status]),"purchase-report.xlsx",["PO No","Supplier","Date","Amount","Status"])};

async function openPdfWindow(docTitle,bodyHtml,footerLeft){

 </body></html>`);
 w.document.close();
 const imgs=[...w.document.querySelectorAll("img[data-pdf-imgid]")];
 for(const im of imgs){
  const id=im.getAttribute("data-pdf-imgid");
  if(!id)continue;
  const blob=await ImgDB.get(id);
  if(blob){
   const u=URL.createObjectURL(blob);
   blobUrls.push(u);
   im.src=u;
  }
 }
 await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;setTimeout(r,1200)})));
 const doPrint=()=>{w.print()};
 const pBtn=w.document.getElementById("pdf_do_print");
 const cBtn=w.document.getElementById("pdf_do_close");
 if(pBtn)pBtn.onclick=doPrint;
 if(cBtn)cBtn.onclick=()=>{blobUrls.forEach(u=>URL.revokeObjectURL(u));w.close()};
 w.addEventListener("beforeunload",()=>blobUrls.forEach(u=>URL.revokeObjectURL(u)));
 setTimeout(()=>{try{doPrint()}catch(_){}},350);
}

   <td class="r">${i.qs} / ${i.qw}</td>
   <td class="c">${esc(stLabel)}</td>
  </tr>`;
 }).join("");
 const body=`
  ${pdfHeaderHtml(L("商品清单","PRODUCT CATALOG & STOCK LIST"),`${L("共","Total")} ${rows.length} ${L("款商品","products")} · ${L("日期","Date")}: ${today()}`,`<div class="pdf-badge">${L("库存目录","Catalog")}</div>`)}
  <div class="pdf-kpis">
   <div class="pdf-kpi"><small>${L("商品款数","Products")}</small><b>${rows.length}</b></div>
   <div class="pdf-kpi"><small>${L("货架总库存","Shelf Qty")}</small><b>${totShelf}</b></div>
   <div class="pdf-kpi"><small>${L("仓库总库存","Warehouse Qty")}</small><b>${totWh}</b></div>
   <div class="pdf-kpi"><small>${L("库存总成本","Total Cost")}</small><b>${money(totCost)}</b></div>
  </div>
  <table class="pdf-tbl">
   <thead>
    <tr>
     <th class="c" style="width:30px">#</th>
     <th class="c" style="width:44px">${L("图片","Img")}</th>
     <th>${L("商品","Product")}</th>
     <th>${L("供应商","Suppliers")}</th>
     <th style="width:112px">${L("主条码","Barcode")}</th>
     <th class="r" style="width:62px">${L("会员价","Member")}</th>
     <th class="r" style="width:62px">${L("非会员","Retail")}</th>
     <th class="r" style="width:62px">${L("成本","Cost")}</th>
     <th class="r" style="width:68px">${L("架/仓","S/W")}</th>
     <th class="c" style="width:52px">${L("状态","Status")}</th>
    </tr>
   </thead>
   <tbody>${rowsHtml||`<tr><td colspan="10" class="c" style="padding:16px;color:#6b7280">${L("暂无商品数据","No products")}</td></tr>`}</tbody>
  </table>
 `;
 await openPdfWindow(L("商品清单 PDF","Product Catalog PDF"),body,L("商品清单导出","Product Catalog Export"));
}
